name: Docker Hub Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tanmayvaij
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: tanmayvaij/capsulex-auth-backend:latest
          cache-from: type=registry,ref=tanmayvaij/capsulex-auth-backend:buildcache
          cache-to: type=registry,ref=tanmayvaij/capsulex-auth-backend:buildcache,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: tanmayvaij/capsulex-auth-frontend:latest
          cache-from: type=registry,ref=tanmayvaij/capsulex-auth-frontend:buildcache
          cache-to: type=registry,ref=tanmayvaij/capsulex-auth-frontend:buildcache,mode=max
